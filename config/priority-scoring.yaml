version: 1
principle: "maior resultado com menor esforço"

dimensions:
  financial_impact:
    weight: 0.26
    scale: 0-100
  operational_impact:
    weight: 0.12
    scale: 0-100
  risk_impact:
    weight: 0.14
    scale: 0-100
  urgency:
    weight: 0.10
    scale: 0-100
  causal_confidence:
    weight: 0.12
    scale: 0-100
  reversibility:
    weight: 0.06
    scale: 0-100
  ease:
    weight: 0.12
    scale: 0-100
  time_to_value:
    weight: 0.08
    scale: 0-100

gates:
  minimum_data_quality: 60
  minimum_confidence_ready_for_decision: 70
  human_approval_required_if:
    - freight_pricing_below_minimum_margin
    - carrier_selection_commercial_commitment
    - customer_or_supplier_block
    - disciplinary_people_action
    - legal_or_tax_final_interpretation
    - material_contract_or_payment
    - fraud_allegation
    - irreversible_high_impact_action

labels:
  85-100: "EXECUTAR/DECIDIR AGORA"
  70-84: "ALTA PRIORIDADE"
  50-69: "INVESTIGAR OU DELEGAR"
  0-49: "BAIXA PRIORIDADE"

notes:
  - "Impacto absoluto (R$) prevalece sobre variação percentual isolada."
  - "Se houver risco crítico (ex.: cotação abaixo da margem mínima), contenção pode preceder score."
  - "Score é suporte à decisão, não substituto de julgamento."
  - "Nenhuma rentabilidade por viagem/cliente é READY_FOR_DECISION sem alocação de custo confirmada (camada 1, 2 ou conciliação manual — ver DATA_MODEL.md)."
